<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reel — Personalised Movie Recommendations</title>
<style>
  :root{--bg:#0e0f13;--panel:#171920;--panel2:#1f222b;--line:#2a2e39;--text:#e9eaee;--muted:#9097a6;
        --accent:#f5b942;--cf:#6ea8fe;--cb:#7ed6a5;--pop:#e38ab8;--err:#ff7a7a}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{display:flex;align-items:center;gap:16px;padding:18px 28px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .brand{font-weight:800;font-size:22px;letter-spacing:-.02em}.brand span{color:var(--accent)}
  .sub{color:var(--muted);font-size:13px}
  .grow{flex:1}
  input,button,select{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
  button{cursor:pointer;background:var(--accent);color:#1b1404;border:none;font-weight:650}
  button.ghost{background:transparent;color:var(--text);border:1px solid var(--line);font-weight:500}
  button:disabled{opacity:.5;cursor:default}
  main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;padding:24px 28px;max-width:1400px;margin:0 auto}
  @media(max-width:980px){main{grid-template-columns:1fr}}
  h2{font-size:15px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 12px;font-weight:650}
  .meta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .pill{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12.5px;color:var(--muted)}
  .pill b{color:var(--text);font-weight:600}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
  .rank{color:var(--accent);font-weight:800;font-size:13px}
  .title{font-weight:650;font-size:15.5px;line-height:1.25;cursor:pointer}.title:hover{color:var(--accent)}
  .genres{display:flex;gap:5px;flex-wrap:wrap}.g{font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 6px}
  .why{font-size:12.5px;color:var(--muted)}.why b{color:var(--text);font-weight:550}
  .bars{display:grid;grid-template-columns:72px 1fr;gap:3px 8px;font-size:11.5px;color:var(--muted);align-items:center}
  .bar{height:6px;border-radius:3px;background:var(--panel2);overflow:hidden}.bar i{display:block;height:100%}
  .pred{font-size:12.5px}.pred b{color:var(--accent)}
  .stars{display:flex;gap:2px}.stars button{background:none;border:none;padding:0 1px;color:#4a4f5c;font-size:18px;line-height:1}
  .stars button.on{color:var(--accent)}
  aside{display:flex;flex-direction:column;gap:22px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
  .list{display:flex;flex-direction:column;gap:2px;max-height:340px;overflow:auto}
  .row{display:flex;justify-content:space-between;gap:10px;padding:6px 4px;border-bottom:1px solid var(--line);font-size:13.5px}
  .row:last-child{border:none}.row .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}.row .t:hover{color:var(--accent)}
  .r{color:var(--accent);font-weight:650;white-space:nowrap}
  .search-res .row{flex-direction:column;align-items:flex-start}
  .empty{color:var(--muted);font-size:13.5px;padding:10px 0}
  .err{color:var(--err)}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:10px 16px;border-radius:10px;opacity:0;transition:.25s;pointer-events:none}
  .toast.show{opacity:1}
  dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:14px;max-width:560px;width:92%}
  dialog::backdrop{background:#000a}
  a{color:var(--accent)}
</style>
</head>
<body>
<header>
  <div><div class="brand">Reel<span>.</span></div><div class="sub">Hybrid collaborative + content-based recommendations</div></div>
  <div class="grow"></div>
  <label class="sub" for="uid">User ID</label>
  <input id="uid" type="number" min="1" value="1" style="width:110px">
  <button id="go">Recommend</button>
  <button class="ghost" id="random">Random user</button>
  <button class="ghost" id="newuser">New user (cold start)</button>
  <a class="sub" href="/docs" target="_blank">API docs</a>
</header>

<main>
  <section>
    <h2>Recommended for you</h2>
    <div class="meta" id="meta"></div>
    <div class="grid" id="recs"><div class="empty">Loading…</div></div>
  </section>
  <aside>
    <div class="panel">
      <h2>Rate a movie</h2>
      <input id="q" placeholder="Search titles…" style="width:100%">
      <div class="list search-res" id="results"></div>
    </div>
    <div class="panel">
      <h2>Your ratings <span id="total" class="sub"></span></h2>
      <div class="list" id="history"></div>
    </div>
    <div class="panel sub" id="sys"></div>
  </aside>
</main>

<dialog id="dlg"><div id="dlgbody"></div><p style="text-align:right;margin:12px 0 0"><button class="ghost" onclick="dlg.close()">Close</button></p></dialog>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let uid = Number(new URLSearchParams(location.search).get("user") || 1);
let maxUser = 10000;
let myRatings = new Map();

async function api(path, opts = {}) {
  const t0 = performance.now();
  const res = await fetch(path, {headers: {"Content-Type": "application/json"}, ...opts});
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.detail ? (typeof body.detail === "string" ? body.detail : JSON.stringify(body.detail)) : res.statusText);
  body._ms = Number(res.headers.get("X-Response-Time-ms")) || (performance.now() - t0);
  return body;
}
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2200); }

function stars(movieId, current) {
  let h = `<div class="stars" data-m="${movieId}">`;
  for (let i = 1; i <= 5; i++) h += `<button title="${i} star${i>1?"s":""}" data-v="${i}" class="${current >= i ? "on" : ""}">★</button>`;
  return h + "</div>";
}
document.addEventListener("click", async e => {
  const b = e.target.closest(".stars button");
  if (b) {
    const m = Number(b.parentElement.dataset.m), v = Number(b.dataset.v);
    try { await api(`/api/users/${uid}/ratings/${m}`, {method: "PUT", body: JSON.stringify({rating: v})});
          toast(`Rated ${v}★ — recommendations updated`); await refresh(); } catch (err) { toast(err.message); }
    return;
  }
  const t = e.target.closest("[data-movie]");
  if (t) showSimilar(Number(t.dataset.movie));
});

function bar(label, v, color) {
  const pct = Math.max(2, Math.min(100, 50 + v * 18));
  return `<span>${label}</span><div class="bar"><i style="width:${pct}%;background:${color}"></i></div>`;
}

async function loadRecs() {
  const recs = $("#recs");
  try {
    const d = await api(`/api/users/${uid}/recommendations?n=12`);
    $("#meta").innerHTML = `
      <span class="pill">User <b>#${d.user_id}</b></span>
      <span class="pill">Strategy <b>${esc(d.strategy)}</b></span>
      <span class="pill">CF weight <b>${Math.round(d.cf_weight*100)}%</b></span>
      <span class="pill">Ratings used <b>${d.n_ratings_used}</b></span>
      <span class="pill">${d.cached ? "<b>cache hit</b>" : "computed"} · <b>${d._ms.toFixed(1)} ms</b></span>`;
    recs.innerHTML = d.items.map(it => `
      <div class="card">
        <div class="rank">#${it.rank}</div>
        <div class="title" data-movie="${it.movie_id}">${esc(it.title)}</div>
        <div class="genres">${it.genres.map(g => `<span class="g">${esc(g)}</span>`).join("")}</div>
        <div class="pred">Predicted rating <b>${it.predicted_rating.toFixed(1)}★</b></div>
        ${it.because_you_liked ? `<div class="why">Because you liked <b>${esc(it.because_you_liked.title)}</b></div>` : `<div class="why">Popular with viewers</div>`}
        <div class="bars">${bar("Collab.", it.signals.collaborative, "var(--cf)")}${bar("Content", it.signals.content * 4 - 1, "var(--cb)")}${bar("Popular", it.signals.popularity, "var(--pop)")}</div>
        ${stars(it.movie_id, 0)}
      </div>`).join("") || `<div class="empty">No recommendations.</div>`;
  } catch (err) { $("#meta").innerHTML = ""; recs.innerHTML = `<div class="empty err">${esc(err.message)}</div>`; }
}

async function loadHistory() {
  try {
    const d = await api(`/api/users/${uid}/ratings?limit=200`);
    myRatings = new Map(d.ratings.map(r => [r.id, r.rating]));
    $("#total").textContent = `(${d.total_ratings})`;
    $("#history").innerHTML = d.ratings.map(r => `<div class="row"><span class="t" data-movie="${r.id}">${esc(r.title)}</span><span class="r">${r.rating.toFixed(1)}★</span></div>`).join("")
      || `<div class="empty">No ratings yet — search and rate a few movies.</div>`;
  } catch (err) { $("#history").innerHTML = `<div class="empty err">${esc(err.message)}</div>`; $("#total").textContent = ""; }
}

let searchTimer;
$("#q").addEventListener("input", e => { clearTimeout(searchTimer); searchTimer = setTimeout(() => search(e.target.value), 200); });
async function search(q) {
  if (!q.trim()) { $("#results").innerHTML = ""; return; }
  const d = await api(`/api/movies/search?q=${encodeURIComponent(q)}&limit=8`);
  $("#results").innerHTML = d.results.map(m => `<div class="row"><span class="t" data-movie="${m.id}">${esc(m.title)}</span>${stars(m.id, myRatings.get(m.id) || 0)}</div>`).join("")
    || `<div class="empty">No matches.</div>`;
}

async function showSimilar(mid) {
  const [m, s] = await Promise.all([api(`/api/movies/${mid}`), api(`/api/movies/${mid}/similar?n=8`)]);
  $("#dlgbody").innerHTML = `<h3 style="margin:0 0 4px">${esc(m.title)}</h3>
    <div class="genres" style="margin-bottom:8px">${m.genres.map(g => `<span class="g">${esc(g)}</span>`).join("")}</div>
    <div class="sub">${m.num_ratings ?? 0} ratings · average ${m.avg_rating_shrunk ?? "–"}★</div>
    <div style="margin:10px 0">Your rating: ${stars(mid, myRatings.get(mid) || 0)}</div>
    <h2 style="margin-top:16px">More like this</h2>
    <div class="list">${s.similar.map(x => `<div class="row"><span class="t" data-movie="${x.movie_id}">${esc(x.title)}</span><span class="sub">${x.similarity.toFixed(2)}</span></div>`).join("")}</div>`;
  if (!dlg.open) dlg.showModal();
}

async function loadSys() {
  try {
    const s = await api("/api/stats");
    maxUser = s.database.users;
    $("#sys").innerHTML = `<b>${s.database.users.toLocaleString()}</b> users · <b>${s.database.movies.toLocaleString()}</b> movies · <b>${s.database.ratings.toLocaleString()}</b> ratings<br>
      DB: ${s.database.dialect} · cache: ${s.cache.backend} (hit rate ${(s.cache.hit_rate*100).toFixed(0)}%)<br>
      model ${esc(s.model?.version ?? "not trained")}`;
  } catch {}
}

async function refresh() { history.replaceState(null, "", `?user=${uid}`); $("#uid").value = uid; await Promise.all([loadRecs(), loadHistory()]); loadSys(); }
$("#go").onclick = () => { uid = Number($("#uid").value) || 1; refresh(); };
$("#uid").addEventListener("keydown", e => { if (e.key === "Enter") $("#go").click(); });
$("#random").onclick = () => { uid = 1 + Math.floor(Math.random() * maxUser); refresh(); };
$("#newuser").onclick = async () => {
  const u = await api("/api/users", {method: "POST", body: JSON.stringify({name: "guest"})});
  uid = u.id; toast(`Created user #${uid} — rate a few movies to personalise`); refresh();
};
refresh();
</script>
</body>
</html>
