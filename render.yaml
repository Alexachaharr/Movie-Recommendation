# Render Blueprint: New > Blueprint > pick this repo.
services:
  - type: web
    name: movie-recommender
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: movie-recommender-db
          property: connectionString
      - key: ADMIN_TOKEN
        generateValue: true
      - key: WEB_CONCURRENCY
        value: "2"
    disk:
      name: models
      mountPath: /app/models
      sizeGB: 1

databases:
  - name: movie-recommender-db
    plan: basic-256mb
